  name: CD

  on:
    push:
      branches: [main]

  env:
    REGISTRY: ghcr.io  
    IMAGE_PREFIX: ghcr.io/nagmani001/lovable

  jobs:
    changes:
      runs-on: ubuntu-latest
      outputs:
        backend: ${{ steps.filter.outputs.backend }}
        web: ${{ steps.filter.outputs.web }}
      steps:
        - uses: actions/checkout@v4
        - uses: dorny/paths-filter@v3
          id: filter
          with:
            filters: |
              backend:
                - 'apps/backend/**'
                - 'packages/database/**'
                - 'packages/common/**'
                - 'packages/email/**'
                - 'packages/orchestrator/**'
                - 'packages/orchestrator-lg/**'
                - 'docker/backend/**'
              web:
                - 'apps/web/**'
                - 'packages/ui/**'
                - 'packages/common/**'
                - 'docker/web/**'

    # Step 2: Build and push only what changed
    build-backend:
      needs: changes
      if: needs.changes.outputs.backend == 'true'
      runs-on: ubuntu-latest
      permissions:
       contents: read
       packages: write
      steps:
        - uses: actions/checkout@v4

        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}  

        - name: Build and push backend
          uses: docker/build-push-action@v6
          with:
            context: .
            file: docker/backend/Dockerfile
            push: true
            tags: |
              ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
              ${{ env.IMAGE_PREFIX }}/backend:latest

    build-web:
      needs: changes
      if: needs.changes.outputs.web == 'true'
      runs-on: ubuntu-latest
      permissions:
       contents: read
       packages: write
      steps:
        - uses: actions/checkout@v4

        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and push web
          uses: docker/build-push-action@v6
          with:
            context: .
            file: docker/web/Dockerfile
            push: true
            tags: |
              ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
              ${{ env.IMAGE_PREFIX }}/web:latest

    deploy:
      needs: [build-backend, build-web]
      if: always() && !failure() && !cancelled()
      runs-on: ubuntu-latest
      permissions:
        contents: read
      steps:
        - uses: actions/checkout@v4

        - name: Authenticate to GCP
          id: auth
          uses: google-github-actions/auth@v3
          with:
            credentials_json: ${{ secrets.GCP_SA_KEY }}

        - name: Get GKE credentials
          id: get-credentials
          uses: google-github-actions/get-gke-credentials@v3
          with:
            project_id: ${{ vars.GKE_PROJECT_ID }}
            cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
            location: ${{ vars.GKE_LOCATION }}

        - name: Update image tags to the new SHA
          run: |
            sed -i "s|backend:latest|backend:${{ github.sha }}|" \
              k8s/backend/deployment.yaml k8s/backend/migrate-job.yaml
            sed -i "s|web:latest|web:${{ github.sha }}|" \
              k8s/web/deployment.yaml

        - name: Run migrations with the new image
          if: needs.build-backend.result == 'success'
          run: |
            kubectl -n lovable delete job backend-migrate --ignore-not-found
            kubectl apply -f k8s/backend/migrate-job.yaml
            kubectl -n lovable wait --for=condition=complete job/backend-migrate --timeout=300s

        - name: Roll out backend
          if: needs.build-backend.result == 'success'
          run: |
            kubectl apply -f k8s/backend/deployment.yaml
            kubectl -n lovable rollout status deployment/backend --timeout=300s

        - name: Roll out web
          if: needs.build-web.result == 'success'
          run: |
            kubectl apply -f k8s/web/deployment.yaml
            kubectl -n lovable rollout status deployment/web --timeout=300s

        - name: Verify health through the ingress
          run: |
            curl -f --retry 5 --retry-delay 3 https://lovable.nagmani.site/api/health || exit 1
            curl -f --retry 5 --retry-delay 3 -o /dev/null https://lovable.nagmani.site/ || exit 1

