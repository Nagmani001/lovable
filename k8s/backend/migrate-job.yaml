apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: lovable
  labels:
    app: backend
spec:
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: migrate
          image: ghcr.io/nagmani001/lovable/backend:latest
          imagePullPolicy: Always
          command: ["sh", "-c", "cd packages/database && npx prisma@7.4.1 migrate deploy"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1"
  backoffLimit: 4
  ttlSecondsAfterFinished: 300
