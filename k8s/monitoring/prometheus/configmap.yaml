apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lovable
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: backend
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: backend
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            regex: lovable
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "5001"
            action: keep